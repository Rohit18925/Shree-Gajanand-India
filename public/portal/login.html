<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGI Portal Login</title><link rel="stylesheet" href="/portal/portal.css"></head>
<body><main class="auth-page"><section class="auth-panel">
<div class="auth-brand"><strong>Shree Gajanand India</strong><span>Employee Management Portal</span></div>
<h1 class="auth-title">Portal Login</h1><p class="auth-subtitle">Sign in with your company portal account.</p>
<form id="loginForm">
<div class="form-group"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
<div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="primary-btn" id="loginButton" type="submit">Sign In</button><p class="form-message" id="message" aria-live="polite"></p>
</form></section>
<section class="auth-visual"><div class="auth-visual-content"><h2>Manage people, attendance and site records in one place.</h2>
<p>Internal portal for Shree Gajanand India with controlled access for Admin, HR/Office and Site Supervisors.</p></div></section>
</main><script src="/portal/portal.js"></script></body></html>
